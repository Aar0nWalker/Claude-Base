services:
  web:
    build:
      context: ./frontend
      args:
        - BACKEND_URL=http://api:8000
    image: "{{PROJECT_SLUG}}-web:latest"
    # Bound to localhost — nginx fronts it. Docker publishes ports straight into
    # iptables (bypassing UFW), so the 127.0.0.1 binding is what keeps it private.
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./backend
    image: "{{PROJECT_SLUG}}-api:latest"
    # Localhost only — reached over the internal docker network (api:8000),
    # proxied by Next (/backend/*); never exposed to the internet directly.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - storage_data:/storage
      - ./backups:/backups
    restart: unless-stopped

  worker-fast:
    build: ./backend
    image: "{{PROJECT_SLUG}}-worker:latest"
    command: arq app.worker.FastWorkerSettings
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - storage_data:/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Telegram worker-bot: dual-agent (Claude + Codex) task queue over Telegram.
  # Optional — omit if you don't use the parallel-work bot. Talks to Telegram
  # directly (or through WORKER_BOT_PROXY_URL if your host needs a proxy).
  worker-bot:
    build: ./backend
    image: "{{PROJECT_SLUG}}-api:latest"
    env_file:
      - .env
    environment:
      - WORKER_BOT_STATE_DIR=/app/.agents/worker-bot
      - WORKER_BOT_PROXY_URL=${WORKER_BOT_PROXY_URL:-}
      - HTTP_PROXY=${WORKER_BOT_PROXY_URL:-}
      - HTTPS_PROXY=${WORKER_BOT_PROXY_URL:-}
      - NO_PROXY=${WORKER_BOT_NO_PROXY:-localhost,127.0.0.1,::1}
    command: python3 scripts/worker_bot.py run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./scripts:/app/scripts:ro
      - ./.env:/app/.env:ro
      - ./.agents:/app/.agents
    depends_on:
      - api
    restart: unless-stopped

volumes:
  storage_data:
  redis_data:
  pg_data:
